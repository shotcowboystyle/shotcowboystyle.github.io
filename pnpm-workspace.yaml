# pnpm 11 defaults `verifyDepsBeforeRun` to `install`, which spawns a real
# install (rewriting package.json and pnpm-lock.yaml) on every `pnpm run` and
# `pnpm exec` — including each parallel lefthook command. `warn` keeps the
# staleness signal without the write.
verifyDepsBeforeRun: warn

overrides:
  lodash: '>=4.18.1'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@cspell/cspell-bundled-dicts@10.2.1'
  - '@cspell/cspell-json-reporter@10.2.1'
  - '@cspell/cspell-performance-monitor@10.2.1'
  - '@cspell/cspell-pipe@10.2.1'
  - '@cspell/cspell-resolver@10.2.1'
  - '@cspell/cspell-service-bus@10.2.1'
  - '@cspell/cspell-types@10.2.1'
  - '@cspell/cspell-worker@10.2.1'
  - '@cspell/dynamic-import@10.2.1'
  - '@cspell/filetypes@10.2.1'
  - '@cspell/rpc@10.2.1'
  - '@cspell/strong-weak-map@10.2.1'
  - '@cspell/url@10.2.1'
  - cspell-config-lib@10.2.1
  - cspell-dictionary@10.2.1
  - cspell-gitignore@10.2.1
  - cspell-glob@10.2.1
  - cspell-grammar@10.2.1
  - cspell-io@10.2.1
  - cspell-lib@10.2.1
  - cspell-trie-lib@10.2.1
  - cspell@10.2.1
  - daisyui@5.7.28
  - happy-dom@20.14.0
