name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_call:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run types:check

      - name: Install playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build app
        run: pnpm run build
        env:
          PUBLIC_MAPLIBRE_TILES_API_KEY: ${{ secrets.PUBLIC_MAPLIBRE_TILES_API_KEY }}
          PUBLIC_GOOGLE_SITE_VERIFICATION_ID: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION_ID }}

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Run e2e tests
        run: pnpm run test

      # `playwright.config.ts` uses the `blob` reporter on CI, which writes to
      # `blob-report/`. Traces, videos and screenshots go to `e2e/output`.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            blob-report/
            e2e/output/
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
