name: CI

# PR runs are superseded by newer pushes; main runs deploy, so let them finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: ['main']
    paths-ignore: &docs-only
      - '*.md'
      - '.claude/**'
      - '.agents/**'
      - '.pi/**'
  pull_request:
    branches: ['main']
    paths-ignore: *docs-only
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run types:check

      # Ahead of the browser download and production build so a broken unit
      # test fails the job cheaply.
      - name: Unit tests
        run: pnpm run test:unit

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      # Browsers come from the cache; only the OS packages are missing.
      - name: Install playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Build app
        run: pnpm run build
        env:
          PUBLIC_MAPLIBRE_TILES_API_KEY: ${{ secrets.PUBLIC_MAPLIBRE_TILES_API_KEY }}
          PUBLIC_GOOGLE_SITE_VERIFICATION_ID: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION_ID }}

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # The e2e preview is served behind portless at e2e.shotcowboystyle.localhost.
      # Started as root because portless cannot prompt for sudo without a TTY, and
      # a root proxy writes the /etc/hosts entries WebKit needs to resolve
      # `*.localhost`. Plain HTTP skips trusting its local CA.
      - name: Start portless proxy
        run: sudo env "PATH=$PATH" "$(pnpm bin)/portless" proxy start --no-tls

      # One Playwright run over all of e2e/tests. `pnpm run test` would re-run
      # the unit tests and start three Playwright runs, each wiping the
      # previous run's `blob-report/`.
      - name: Run e2e tests
        run: pnpm exec playwright test

      # `playwright.config.ts` uses the `blob` reporter on CI, which writes to
      # `blob-report/`. Traces, videos and screenshots go to `e2e/output`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            blob-report/
            e2e/output/
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
